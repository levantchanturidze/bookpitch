name: Verify Sentry and start the soak

# The one supported way a soak begins.
#
# §4.7: eliminate manual receipt copying and issue-body editing. Before this
# workflow, the sequence was "run verify-sentry.mjs somewhere, copy the JSON it
# printed, paste it into a workflow form". Every step of that is a place for a
# human to paste last week's receipt, or a receipt for a different release, and
# the soak would then spend 24 hours revalidating it perfectly.
#
# So the receipt is never handled by a person. It is written to a file on the
# runner, read from that file by the soak controller in the SAME job, and never
# uploaded, printed or stored. The only thing a human types is the SHA they
# believe is deployed — and the first step refuses if production disagrees.
#
# Six steps, in order, each refusing rather than continuing:
#
#   1. resolve what production is ACTUALLY serving, and refuse if it is not the
#      named SHA on both canonical hosts;
#   2. refuse if any release-blocking incident is open;
#   3. verify Sentry for real — deployed server probe, real Chromium browser
#      probe, both events read back from Sentry's API, both stacks resolved to
#      their own source, public source maps affirmatively absent;
#   4. that step writes a signed receipt, or writes nothing;
#   5. start the soak from that file;
#   6. the soak issue is the durable evidence, written by the controller.

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'The exact SHA that must be serving production. Refused if it is not.'
        required: true
        type: string

permissions:
  contents: read
  # Reading the Production Deployment record to pin the soak.
  deployments: read
  # The controller reads workflow-run history for the monitor, backup and cron.
  actions: read
  # The soak issue is the durable evidence.
  issues: write

concurrency:
  # Starting two soaks would create two windows, and whichever controller wrote
  # last would win.
  group: production-soak
  cancel-in-progress: false

jobs:
  verify-and-start:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---- 1. What is production ACTUALLY serving? --------------------------
      - name: Resolve and pin the deployed release
        id: deployed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANT: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          dep=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=Production&per_page=1" --jq '.[0].id')
          sha=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=Production&per_page=1" --jq '.[0].sha')
          state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$dep/statuses?per_page=1" --jq '.[0].state')
          echo "deployment=$dep sha=$sha state=$state"

          if [ "$sha" != "$WANT" ]; then
            echo "::error::Production's latest deployment is $sha, not the requested $WANT."
            exit 1
          fi
          if [ "$state" != "success" ]; then
            echo "::error::Deployment $dep is in state '$state', not success."
            exit 1
          fi

          # And the hosts must actually be serving it — a successful deployment
          # record is not the same as an alias pointing at it.
          for host in bookpitch.ge www.bookpitch.ge; do
            served=$(curl -sSIL "https://$host/api/health" | tr -d '\r' \
              | awk 'tolower($1) == "x-bookpitch-release:" { print $2 }' | tail -1)
            echo "$host serves ${served:-(none)}"
            if [ "$served" != "$WANT" ]; then
              echo "::error::$host serves '${served:-nothing}', not $WANT."
              exit 1
            fi
          done

          echo "deployment_id=$dep" >> "$GITHUB_OUTPUT"

      # ---- 2. Nothing UNRELATED may be open ---------------------------------
      #
      # The observability incident is the one this workflow exists to resolve.
      # Refusing to run while it is open was a deadlock: the incident cannot be
      # closed without verification, and verification refused to start while it
      # was open.
      #
      # Every OTHER open incident still refuses. A soak that begins with
      # production unhealthy in some unrelated way is not evidence.
      - name: Refuse while an unrelated incident is open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Nominated from the REST issues listing and then CONFIRMED one by
          # one against the per-issue endpoint — see scripts/blocking-incidents.mjs.
          # `gh issue list` reads the search index, which lags writes and is what
          # made the re-check below refuse on an incident that was already closed.
          if ! node scripts/blocking-incidents.mjs --allow-observability; then
            echo "::error::A soak that begins with production unhealthy is not evidence."
            exit 1
          fi
          echo "Only the observability incident may be open here; this workflow resolves it."

      - name: Install Chromium for the browser probe
        run: npx playwright install --with-deps chromium

      # ---- 3 & 4. Real verification, and a signed receipt or nothing --------
      - name: Verify Sentry against the deployed release
        env:
          APP_URL: https://bookpitch.ge
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_ENVIRONMENT: production
          # Written to the runner's filesystem and read by the next step. Never
          # uploaded as an artifact, never printed, never pasted.
          SENTRY_RECEIPT_OUT: ${{ runner.temp }}/sentry-receipt.json
        run: node scripts/verify-sentry.mjs

      # ---- 5. Close the observability incident, BY EVIDENCE ------------------
      #
      # The production monitor cannot do this. Its check counts how many DSN env
      # vars are unset, and zero only means two names are present — a revoked or
      # mistyped DSN looks identical from there. It is marked `canClose: false`
      # for exactly this reason.
      #
      # This step runs only if the verification above passed, which means real
      # events were emitted by the deployed application in both runtimes, read
      # back through Sentry's API, matched on release, environment, nonce and
      # runtime, and resolved to their own source.
      - name: Resolve the observability incident
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Written to a file: a multi-line body inline in this block would
          # break the YAML scalar on its first blank line.
          cat > "${RUNNER_TEMP}/resolution.md" <<'MD'
          Resolved by end-to-end verification.

          Real events were emitted by the deployed application in BOTH runtimes,
          read back through Sentry's API, and matched on release, environment,
          nonce and runtime, with each stack resolved to its own probe source.
          Public source maps were affirmatively checked and found absent.

          Closed by evidence rather than by configuration. The monitor's
          `production-observability-unconfigured` check counts unset DSN
          variable NAMES; zero only means two names are present, and a revoked
          or mistyped DSN looks identical from there. It is marked
          `canClose: false` so it can raise this alarm and never declare it
          over.
          MD
          sed -i 's/^          //' "${RUNNER_TEMP}/resolution.md"
          printf '\nVerification run: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            >> "${RUNNER_TEMP}/resolution.md"

          gh issue list --label ops-incident --state open --json number,body \
            --jq '.[] | select(.body | contains("bookpitch-ops-incident:production-observability-unconfigured")) | .number' \
            > "${RUNNER_TEMP}/observability-incidents.txt"

          while read -r n; do
            [ -n "$n" ] || continue
            gh issue comment "$n" --body-file "${RUNNER_TEMP}/resolution.md"
            gh issue close "$n"
            echo "closed #$n by evidence"
          done < "${RUNNER_TEMP}/observability-incidents.txt"

      # ---- 6. Nothing blocking may remain, now ------------------------------
      - name: Re-check that no incident is open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # THIS STEP REFUSED A CLEAN RELEASE. Run 34208400168: the step above
          # logged `closed #44 by evidence` at 09:10:36.658, the REST record
          # shows `closed_at: 09:10:36Z`, and this listing at 09:10:37.797 —
          # 1.1s later — still returned #44 as open. The job refused and
          # `Start the soak` was skipped. Every successful verification closes
          # that incident one step earlier, so this gate lost the race as a
          # matter of course, and no soak had ever started.
          #
          # `gh issue list` is served from GitHub's SEARCH index, which is
          # eventually consistent. The per-issue REST endpoint is not — it is
          # the read that already said `closed` while the listing said open.
          # So the listing only nominates, and each candidate is confirmed.
          #
          # Settle first: the dangerous staleness is the other one, a genuinely
          # open incident not yet in the listing, and no per-issue read can fix
          # that because it was never nominated. Confirmation only ever REMOVES
          # a candidate proven closed; an unreadable one keeps blocking.
          sleep 15
          node scripts/blocking-incidents.mjs

      # ---- 7. Start the soak from that file ---------------------------------
      - name: Start the soak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MONITOR_PRODUCTION_URL: https://bookpitch.ge
          SOAK_START: 'true'
          SOAK_RELEASE_SHA: ${{ inputs.release_sha }}
          SOAK_DEPLOYMENT_ID: ${{ steps.deployed.outputs.deployment_id }}
          SOAK_SENTRY_RECEIPT_FILE: ${{ runner.temp }}/sentry-receipt.json
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: node scripts/soak-controller.mjs

      - name: Remove the receipt from the runner
        if: always()
        run: rm -f "${{ runner.temp }}/sentry-receipt.json"
