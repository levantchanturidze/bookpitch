name: Scheduled crons

# Reminders every 15 min; housekeeping hourly.
# Both endpoints authenticate via bearer CRON_SECRET (repo secret).
# APP_URL must be the deployed origin.

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '3 * * * *'
    - cron: '17 2 * * *'
    - cron: '0 8 * * 1'
    - cron: '30 1 1 * *'
  workflow_dispatch:
    inputs:
      # A manual dispatch used to default to BLANK, and blank ran all five
      # jobs. "Drain the outbox by hand" was therefore impossible without also
      # firing reminders at every tenant, and the most likely way to run this
      # workflow — open it, press the button, change nothing — was the most
      # dangerous one. `runReminderTick` selects appointments in
      # [now, now + reminderLeadHours], so that dispatch really can send mail
      # and SMS to a real customer whose appointment falls in the window.
      #
      # There is now no implicit default. A job must be named, and the two
      # choices that can reach a customer additionally require the confirm box
      # below to be typed out. Getting it wrong FAILS the run rather than
      # quietly doing nothing — a green run that performed no work is the same
      # class of useless signal this repository keeps finding.
      only:
        description: 'Which job to run. "reminders" and "all" CONTACT REAL CUSTOMERS and also need the confirm box.'
        required: true
        type: choice
        default: housekeeping
        options:
          # Ordered least-dangerous first, so a mis-click lands on a job that
          # cannot contact anyone.
          - housekeeping
          - retention
          - db-partitions
          - audit-digest
          - reminders
          - all
      confirm:
        description: 'Required for "reminders" and "all". Type exactly: SEND-REMINDERS-TO-CUSTOMERS'
        required: false
        default: ''
        type: string

jobs:
  # Fails the dispatch when a customer-contacting job was selected without the
  # confirmation. Without this the run would be GREEN and would have done
  # nothing, because every `if:` would simply be false — a healthy signal that
  # means nothing, which is the failure mode CLAUDE.md exists to prevent.
  #
  # Runs only on workflow_dispatch, so it never appears on a scheduled run and
  # cannot affect scheduled reliability.
  dispatch-guard:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require confirmation for jobs that can contact customers
        env:
          ONLY: ${{ inputs.only }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          echo "requested job: $ONLY"
          if [ "$ONLY" = "reminders" ] || [ "$ONLY" = "all" ]; then
            if [ "$CONFIRM" != "SEND-REMINDERS-TO-CUSTOMERS" ]; then
              echo "::error::'$ONLY' sends reminders to real customers. Re-run and type"
              echo "::error::SEND-REMINDERS-TO-CUSTOMERS in the confirm box to proceed."
              exit 1
            fi
            echo "confirmation accepted — reminders WILL be sent"
          else
            echo "'$ONLY' cannot contact a customer; no confirmation required"
          fi

  reminders:
    if: >-
      github.event.schedule == '*/15 * * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.only == 'reminders' || inputs.only == 'all') &&
       inputs.confirm == 'SEND-REMINDERS-TO-CUSTOMERS')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/cron/reminders
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/out -w '%{http_code}' \
            -X POST "${{ secrets.APP_URL }}/api/cron/reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "http=$code"
          cat /tmp/out
          test "$code" -lt 300

  housekeeping:
    if: >-
      github.event.schedule == '3 * * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.only == 'housekeeping' ||
        (inputs.only == 'all' && inputs.confirm == 'SEND-REMINDERS-TO-CUSTOMERS')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/cron/housekeeping
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/out -w '%{http_code}' \
            -X POST "${{ secrets.APP_URL }}/api/cron/housekeeping" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "http=$code"
          cat /tmp/out
          test "$code" -lt 300

  retention:
    # Nightly at 02:17 UTC. Anonymizes customers past
    # Organization.customerRetentionYears.
    if: >-
      github.event.schedule == '17 2 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.only == 'retention' ||
        (inputs.only == 'all' && inputs.confirm == 'SEND-REMINDERS-TO-CUSTOMERS')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/cron/retention
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/out -w '%{http_code}' \
            -X POST "${{ secrets.APP_URL }}/api/cron/retention" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "http=$code"
          cat /tmp/out
          test "$code" -lt 300

  audit-digest:
    # Mondays at 08:00 UTC. Emails a 7-day audit rollup to every owner.
    # P15-004: the weekly '0 8 * * 1' schedule has never fired — GitHub does not
    # guarantee delivery of low-frequency crons and silently dropped it (see
    # Monday 2026-08-17, where the */15 and hourly runs arrived and the weekly
    # one did not). The hourly schedule is delivered reliably, so this job now
    # rides on it as well; runDigestForAllOrgs() is idempotent per ISO week via
    # a unique idempotency key on email_outbox, so extra invocations are no-ops
    # rather than duplicate mail. The weekly entry is kept so the job still
    # fires promptly on Monday morning when GitHub does deliver it.
    if: >-
      github.event.schedule == '0 8 * * 1' ||
      github.event.schedule == '3 * * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.only == 'audit-digest' ||
        (inputs.only == 'all' && inputs.confirm == 'SEND-REMINDERS-TO-CUSTOMERS')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/cron/audit-digest
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/out -w '%{http_code}' \
            -X POST "${{ secrets.APP_URL }}/api/cron/audit-digest" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "http=$code"
          cat /tmp/out
          test "$code" -lt 300

  db-partitions:
    # First of every month, 01:30 UTC. Creates the next 3 monthly
    # partitions on audit_log so writes never fall into the default
    # partition. bp_create_monthly_partition() is idempotent.
    if: >-
      github.event.schedule == '30 1 1 * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.only == 'db-partitions' ||
        (inputs.only == 'all' && inputs.confirm == 'SEND-REMINDERS-TO-CUSTOMERS')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/cron/db-partitions
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/out -w '%{http_code}' \
            -X POST "${{ secrets.APP_URL }}/api/cron/db-partitions" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "http=$code"
          cat /tmp/out
          test "$code" -lt 300
