name: Scheduled crons

# Reminders every 15 min; housekeeping hourly.
# Both endpoints authenticate via bearer CRON_SECRET (repo secret).
# APP_URL must be the deployed origin.

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '3 * * * *'
    - cron: '17 2 * * *'
    - cron: '0 8 * * 1'
    - cron: '30 1 1 * *'
  workflow_dispatch:
    inputs:
      only:
        # A manual dispatch used to run all five jobs, which made "drain the
        # outbox by hand" impossible without also firing reminders at every
        # tenant. That is not a safe operation to have to perform during an
        # incident: `runReminderTick` selects [now, now + leadHours], so a
        # dispatch really can send mail to a real customer whose appointment
        # happens to fall in the window.
        #
        # Blank keeps the previous behaviour — all five — so nothing that
        # relied on it changes.
        description: 'Run only this job (blank = all five, the previous behaviour)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - reminders
          - housekeeping
          - retention
          - audit-digest
          - db-partitions

jobs:
  reminders:
    if: >-
      github.event.schedule == '*/15 * * * *' ||
      (github.event_name == 'workflow_dispatch' && (inputs.only == '' || inputs.only == 'reminders'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/cron/reminders
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/out -w '%{http_code}' \
            -X POST "${{ secrets.APP_URL }}/api/cron/reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "http=$code"
          cat /tmp/out
          test "$code" -lt 300

  housekeeping:
    if: >-
      github.event.schedule == '3 * * * *' ||
      (github.event_name == 'workflow_dispatch' && (inputs.only == '' || inputs.only == 'housekeeping'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/cron/housekeeping
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/out -w '%{http_code}' \
            -X POST "${{ secrets.APP_URL }}/api/cron/housekeeping" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "http=$code"
          cat /tmp/out
          test "$code" -lt 300

  retention:
    # Nightly at 02:17 UTC. Anonymizes customers past
    # Organization.customerRetentionYears.
    if: >-
      github.event.schedule == '17 2 * * *' ||
      (github.event_name == 'workflow_dispatch' && (inputs.only == '' || inputs.only == 'retention'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/cron/retention
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/out -w '%{http_code}' \
            -X POST "${{ secrets.APP_URL }}/api/cron/retention" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "http=$code"
          cat /tmp/out
          test "$code" -lt 300

  audit-digest:
    # Mondays at 08:00 UTC. Emails a 7-day audit rollup to every owner.
    # P15-004: the weekly '0 8 * * 1' schedule has never fired — GitHub does not
    # guarantee delivery of low-frequency crons and silently dropped it (see
    # Monday 2026-08-17, where the */15 and hourly runs arrived and the weekly
    # one did not). The hourly schedule is delivered reliably, so this job now
    # rides on it as well; runDigestForAllOrgs() is idempotent per ISO week via
    # a unique idempotency key on email_outbox, so extra invocations are no-ops
    # rather than duplicate mail. The weekly entry is kept so the job still
    # fires promptly on Monday morning when GitHub does deliver it.
    if: >-
      github.event.schedule == '0 8 * * 1' ||
      github.event.schedule == '3 * * * *' ||
      (github.event_name == 'workflow_dispatch' && (inputs.only == '' || inputs.only == 'audit-digest'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/cron/audit-digest
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/out -w '%{http_code}' \
            -X POST "${{ secrets.APP_URL }}/api/cron/audit-digest" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "http=$code"
          cat /tmp/out
          test "$code" -lt 300

  db-partitions:
    # First of every month, 01:30 UTC. Creates the next 3 monthly
    # partitions on audit_log so writes never fall into the default
    # partition. bp_create_monthly_partition() is idempotent.
    if: >-
      github.event.schedule == '30 1 1 * *' ||
      (github.event_name == 'workflow_dispatch' && (inputs.only == '' || inputs.only == 'db-partitions'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/cron/db-partitions
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/out -w '%{http_code}' \
            -X POST "${{ secrets.APP_URL }}/api/cron/db-partitions" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "http=$code"
          cat /tmp/out
          test "$code" -lt 300
