name: Scheduled crons

# Reminders every 15 min; housekeeping hourly.
# Both endpoints authenticate via bearer CRON_SECRET (repo secret).
# APP_URL must be the deployed origin.

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '3 * * * *'
    - cron: '17 2 * * *'
    - cron: '0 8 * * 1'
    - cron: '30 1 1 * *'
  workflow_dispatch:
    inputs:
      # HOW THIS WAS WRONG BEFORE, TWICE.
      #
      # First it defaulted to BLANK, and blank ran all five jobs — so the most
      # likely way to use the workflow (open it, press the button, change
      # nothing) was also the one that mailed every tenant's customers.
      #
      # Then it defaulted to `housekeeping`, chosen because housekeeping
      # "cannot contact a customer". That was false. runHousekeeping() calls
      # drainEmailOutbox(), which is the component that actually DELIVERS
      # every queued message — reminders, verification mail, password resets.
      # Naming the delivery worker as the safe default was worse than the
      # blank default it replaced, because it looked deliberate.
      #
      # So there is no operational default at all now. `none` is the default,
      # it starts nothing, and the guard fails the run so the mistake is
      # visible rather than silent.
      #
      # Classification is by TRANSITIVE runtime behaviour, not by whether the
      # job's own name sounds like sending:
      #
      #   reminders      sends email and SMS directly            CONTACTS
      #                  (runReminderTick selects appointments in
      #                   [now, now + reminderLeadHours], so a dispatch
      #                   really can mail a real customer right now)
      #   housekeeping   drains email_outbox — delivers it all   CONTACTS
      #   audit-digest   queues into email_outbox (owners)       PRODUCES MAIL
      #   retention      anonymises PII, no email surface        safe
      #   db-partitions  DDL only                                safe
      only:
        description: 'Which job to run. reminders / housekeeping / audit-digest / all DELIVER OR QUEUE REAL EMAIL and need the confirm box.'
        required: true
        type: choice
        default: none
        options:
          # Non-operational sentinel first, so a mis-click does nothing at all.
          - none
          - retention
          - db-partitions
          - audit-digest
          - housekeeping
          - reminders
          - all
      confirm:
        description: 'Required for reminders, housekeeping, audit-digest and all. Type exactly: DELIVER-EMAIL-TO-REAL-RECIPIENTS'
        required: false
        default: ''
        type: string

jobs:
  # Fails the dispatch when a customer-contacting job was selected without the
  # confirmation. Without this the run would be GREEN and would have done
  # nothing, because every `if:` would simply be false — a healthy signal that
  # means nothing, which is the failure mode CLAUDE.md exists to prevent.
  #
  # Runs only on workflow_dispatch, so it never appears on a scheduled run and
  # cannot affect scheduled reliability.
  dispatch-guard:
    # Fails the dispatch when nothing was selected, or when a job that
    # delivers or queues real email was selected without the confirmation.
    #
    # Failing is the point. Every earlier version let a mistake through
    # quietly: a blank default that ran everything, then a `housekeeping`
    # default that looked safe and was the delivery worker. A run that starts
    # nothing and reports success is the same class of useless signal.
    #
    # Runs only on workflow_dispatch, so it can never affect a scheduled run
    # or the scheduled evidence the monitor and soak depend on.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require a deliberate selection, and confirmation for anything that mails
        env:
          ONLY: ${{ inputs.only }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          echo "requested job: $ONLY"

          if [ "$ONLY" = "none" ] || [ -z "$ONLY" ]; then
            echo "::error::No job selected. 'none' is the default on purpose so that"
            echo "::error::pressing the button without choosing does nothing. Pick a job."
            exit 1
          fi

          # Classified by TRANSITIVE behaviour:
          #   reminders     sends email and SMS directly
          #   housekeeping  drains email_outbox, i.e. delivers everything queued
          #   audit-digest  queues owner mail into email_outbox
          case "$ONLY" in
            reminders|housekeeping|audit-digest|all)
              if [ "$CONFIRM" != "DELIVER-EMAIL-TO-REAL-RECIPIENTS" ]; then
                echo "::error::'$ONLY' delivers or queues real email."
                case "$ONLY" in
                  housekeeping) echo "::error::housekeeping runs drainEmailOutbox() — it SENDS everything already queued." ;;
                  audit-digest) echo "::error::audit-digest queues owner mail into email_outbox for delivery." ;;
                  reminders)    echo "::error::reminders sends email and SMS to customers with upcoming appointments." ;;
                  all)          echo "::error::'all' includes reminders, housekeeping and audit-digest." ;;
                esac
                echo "::error::Re-run and type DELIVER-EMAIL-TO-REAL-RECIPIENTS in the confirm box."
                exit 1
              fi
              echo "confirmation accepted — real email WILL be delivered or queued"
              ;;
            retention|db-partitions)
              echo "'$ONLY' has no email surface; no confirmation required"
              ;;
            *)
              echo "::error::Unrecognised job '$ONLY'."
              exit 1
              ;;
          esac

  reminders:
    if: >-
      github.event.schedule == '*/15 * * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.only == 'reminders' || inputs.only == 'all') &&
       inputs.confirm == 'DELIVER-EMAIL-TO-REAL-RECIPIENTS')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/cron/reminders
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/out -w '%{http_code}' \
            -X POST "${{ secrets.APP_URL }}/api/cron/reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "http=$code"
          cat /tmp/out
          test "$code" -lt 300

  housekeeping:
    if: >-
      github.event.schedule == '3 * * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.only == 'housekeeping' || inputs.only == 'all') &&
       inputs.confirm == 'DELIVER-EMAIL-TO-REAL-RECIPIENTS')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/cron/housekeeping
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/out -w '%{http_code}' \
            -X POST "${{ secrets.APP_URL }}/api/cron/housekeeping" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "http=$code"
          cat /tmp/out
          test "$code" -lt 300

  retention:
    # Nightly at 02:17 UTC. Anonymizes customers past
    # Organization.customerRetentionYears.
    if: >-
      github.event.schedule == '17 2 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.only == 'retention' ||
        (inputs.only == 'all' && inputs.confirm == 'DELIVER-EMAIL-TO-REAL-RECIPIENTS')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/cron/retention
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/out -w '%{http_code}' \
            -X POST "${{ secrets.APP_URL }}/api/cron/retention" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "http=$code"
          cat /tmp/out
          test "$code" -lt 300

  audit-digest:
    # Mondays at 08:00 UTC. Emails a 7-day audit rollup to every owner.
    # P15-004: the weekly '0 8 * * 1' schedule has never fired — GitHub does not
    # guarantee delivery of low-frequency crons and silently dropped it (see
    # Monday 2026-08-17, where the */15 and hourly runs arrived and the weekly
    # one did not). The hourly schedule is delivered reliably, so this job now
    # rides on it as well; runDigestForAllOrgs() is idempotent per ISO week via
    # a unique idempotency key on email_outbox, so extra invocations are no-ops
    # rather than duplicate mail. The weekly entry is kept so the job still
    # fires promptly on Monday morning when GitHub does deliver it.
    if: >-
      github.event.schedule == '0 8 * * 1' ||
      github.event.schedule == '3 * * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.only == 'audit-digest' || inputs.only == 'all') &&
       inputs.confirm == 'DELIVER-EMAIL-TO-REAL-RECIPIENTS')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/cron/audit-digest
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/out -w '%{http_code}' \
            -X POST "${{ secrets.APP_URL }}/api/cron/audit-digest" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "http=$code"
          cat /tmp/out
          test "$code" -lt 300

  db-partitions:
    # First of every month, 01:30 UTC. Creates the next 3 monthly
    # partitions on audit_log so writes never fall into the default
    # partition. bp_create_monthly_partition() is idempotent.
    if: >-
      github.event.schedule == '30 1 1 * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.only == 'db-partitions' ||
        (inputs.only == 'all' && inputs.confirm == 'DELIVER-EMAIL-TO-REAL-RECIPIENTS')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/cron/db-partitions
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/out -w '%{http_code}' \
            -X POST "${{ secrets.APP_URL }}/api/cron/db-partitions" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "http=$code"
          cat /tmp/out
          test "$code" -lt 300
