name: k6 load test

# Runs the k6 scheduler-read scenario against staging. Public paths only;
# no session / no writes. Gated on STAGING_URL secret — if unset the job
# no-ops so forks don't fail.
#
# The public-booking scenario is intentionally NOT wired here — it
# creates real appointments. Run it manually against a throwaway org
# when you actually want to load-test the write path.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Skip if STAGING_URL not set
        id: gate
        run: |
          if [ -z "${{ secrets.STAGING_URL }}" ]; then
            echo "STAGING_URL secret is empty — skipping load test."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # P15-007. The gate above only asks whether STAGING_URL is non-empty. If
      # that secret were ever set to the production URL — a one-character
      # mistake in a settings page — this weekly job would generate sustained
      # load against the live service, and nothing here would stop it. This
      # step fails the run instead. It reads the host only; the URL itself is
      # never echoed, so a secret cannot leak into the log.
      - name: Refuse to load-test production
        if: steps.gate.outputs.run == 'true'
        env:
          TARGET_URL: ${{ secrets.STAGING_URL }}
        run: |
          set -euo pipefail
          host="$(printf '%s' "$TARGET_URL" | sed -E 's#^[a-zA-Z]+://##; s#/.*$##; s#:[0-9]+$##' | tr 'A-Z' 'a-z')"
          # vercel.app is included because a Preview deployment inherits
          # production environment variables unless they are explicitly
          # overridden per-environment — so load against a preview URL can
          # land on the production database. Refuse unless the target is
          # demonstrably separate infrastructure.
          for marker in bookpitch.ge vercel.app supabase.co; do
            case "$host" in
              "$marker"|*".$marker")
                echo "::error::STAGING_URL points at a production host. Refusing to generate load."
                exit 1
                ;;
            esac
          done
          echo "target host is not production — proceeding"

      # Pinned to a full commit SHA rather than the mutable `v1` tag — same
      # reasoning as the gitleaks pin in ci.yml, and it matters more here:
      # this job holds STAGING_URL and STAGING_PUBLIC_SLUG, so a moved tag
      # would run attacker-chosen code in a step that can read them.
      # `db07bd9` is what `v1` resolved to on 2026-09-09.
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1
        if: steps.gate.outputs.run == 'true'

      - name: Run scheduler-read scenario
        if: steps.gate.outputs.run == 'true'
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}
          PUBLIC_SLUG: ${{ secrets.STAGING_PUBLIC_SLUG }}
        run: k6 run --summary-export=/tmp/summary.json k6/scheduler-read.js

      - name: Upload summary
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: /tmp/summary.json
