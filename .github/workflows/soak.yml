name: Production soak

# Durable 24-hour soak controller.
#
# The soak has been "about to start" since Phase 15 and has never run, because
# every previous plan needed an interactive session to survive 24 hours. This
# one does not: state lives in a GitHub issue, each tick is one short scheduled
# run, and nothing sleeps on a runner.
#
# Ticks are cheap and read-only against production. They do NOT gate anything
# by themselves — the soak's verdict is published to the issue, which is the
# durable record §13 asks for.
#
# Starting a soak is deliberate: a scheduled tick with no open soak issue does
# nothing. Dispatch with start=true to begin one against an exact SHA.

on:
  schedule:
    # Offset from the production monitor's own schedule so a tick reads
    # observations that already exist rather than racing them.
    - cron: '20,50 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate permissions and evidence collectors. Creates nothing, changes nothing.'
        required: false
        type: boolean
        default: false
      start:
        description: 'Start a NEW soak. Requires release_sha and deployment_id.'
        required: true
        type: boolean
        default: false
      release_sha:
        description: 'Exact merged SHA the soak measures. Required when start=true.'
        required: false
        type: string
        default: ''
      # THE GITHUB DEPLOYMENT RECORD ID, not the Vercel `dpl_...` id.
      #
      # This input used to be described as "Vercel deployment id" while the
      # controller compared it against GitHub's numeric Deployment record id.
      # So a genuine Vercel id could never match, and the only way to make a
      # soak start was to leave it blank — which disabled the check entirely.
      # Two ways to get it wrong, no way to get it right.
      #
      # One authoritative identity model now: the GitHub Deployment record,
      # because that is what the controller can read, verify the status of, and
      # tie to a SHA. Find it with:
      #
      #   gh api "repos/OWNER/REPO/deployments?environment=Production&per_page=1" --jq '.[0].id'
      #
      # The Vercel id is evidence a human may record in the issue, but it is
      # not what the gate compares.
      deployment_id:
        description: 'GitHub Deployment record id (numeric, NOT the Vercel dpl_... id). Required.'
        required: true
        type: string
        default: ''
      # There is deliberately NO sentry_receipt_verified input any more. It was
      # a boolean an operator ticked, which is not evidence that an error would
      # reach a human — it is a self-asserted claim of exactly the kind the
      # rest of this project exists to remove. Receipt is now verified against
      # Sentry's own API using persisted event ids, and needs SENTRY_AUTH_TOKEN,
      # SENTRY_ORG and SENTRY_PROJECT.

permissions:
  contents: read
  # The controller reads workflow-run history for the monitor, backup and cron
  # workflows. Without this every runsFor() call 403s and the controller
  # reports "0 natural observations" — indistinguishable from a quiet window,
  # which is the worst possible failure for a soak.
  actions: read
  # It reads the Production Deployment record and its status to pin the release
  # under soak. Without this the deployment gate cannot be evaluated at all.
  deployments: read
  # It writes its state and evidence to an issue. No repository write access,
  # so it can never push to main.
  issues: write

concurrency:
  # Two ticks racing would double-post and could double-count a restart.
  group: production-soak
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to start a soak without a pinned SHA and deployment id
        if: ${{ inputs.start == true && (inputs.release_sha == '' || inputs.deployment_id == '') }}
        run: |
          echo "::error::start=true requires BOTH release_sha and deployment_id."
          echo "::error::A soak that cannot name the exact deployment it measures is not evidence."
          echo "::error::deployment_id is the numeric GitHub Deployment record id, not a Vercel dpl_... id:"
          echo "::error::  gh api \"repos/\$GITHUB_REPOSITORY/deployments?environment=Production&per_page=1\" --jq '.[0].id'"
          exit 1

      - name: Soak tick
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MONITOR_PRODUCTION_URL: https://bookpitch.ge
          SOAK_DRY_RUN: ${{ inputs.dry_run }}
          SOAK_START: ${{ inputs.start }}
          SOAK_RELEASE_SHA: ${{ inputs.release_sha }}
          SOAK_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: node scripts/soak-controller.mjs
