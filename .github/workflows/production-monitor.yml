name: Production monitor

# Watches bookpitch.ge and the operational jobs behind it, several times an hour
# on paper — see the schedule below for what GitHub actually delivers.
#
# What it actually checks is in scripts/production-monitor.mjs. The short
# version: the public health endpoint returns exactly {"ok":true} with no
# redirect, TLS is valid and not about to expire, the current production
# deployment answers, the cron workflow is still running and not failing
# repeatedly, a backup happened within the last 26 hours, the restore drill is
# not stale, and the database-side symptoms of every scheduled job are at zero.
#
# The script is dependency-free on purpose — no `npm ci`, so a run is seconds,
# not minutes, and the monitor cannot be taken down by a registry outage.
#
# Failures open a deduplicated GitHub issue labelled `ops-incident`, one per
# incident class, and recovery closes it automatically.

on:
  schedule:
    # FOUR separate lines, not one `5,35 * * * *` (2026-10-17).
    #
    # GitHub throttles each schedule LINE on this account to roughly five runs
    # a day, whatever the line asks for. `5,35` asked for 48 a day and got ~5:
    # over the 14 days to 2026-10-16 the gap between scheduled monitor runs had
    # p50 5.0h, p95 7.4h and max 9.0h, so 84% of 24-hour windows contained a gap
    # over the soak's 6-hour observation-gap limit — a soak was a lottery
    # against the scheduler, not a measurement of production. Lines are
    # delivered INDEPENDENTLY (adding cron.yml's deliveries to the monitor's
    # brought that 84% to 0%), so capacity comes from more lines.
    #
    # The 6-hour limit is deliberately NOT raised: a window nobody watched for
    # nine hours is not an observed window. Minutes avoid :00-:05, the
    # top-of-the-hour load GitHub documents as the main cause of delay.
    # Two overlapping deliveries queue (concurrency below). Only a THIRD
    # delivery inside one ~20-second run would cancel the queued one, and the
    # soak counts a cancelled scheduled run against the window — the safe
    # direction, a restart rather than a false pass. It has not happened once
    # in 60 days of history, and the lines did not arrive in bursts.
    # docs/scheduler-resilience.md has the measurements and the post-merge
    # verification.
    - cron: '7 * * * *'
    - cron: '22 * * * *'
    - cron: '37 * * * *'
    - cron: '52 * * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Inject a synthetic failing check to test the alert path (production unaffected)'
        required: false
        default: ''
        type: string
      alerts:
        description: 'Set to "off" to run checks without touching GitHub issues'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  issues: write # open, comment on and close deduplicated incident issues
  actions: read # read cron / backup / restore-drill run outcomes
  deployments: read # confirm the current production deployment is reachable

concurrency:
  group: production-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Check production health
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run production monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bearer for /api/health/ops. The same secret the cron workflow
          # already uses; the endpoint returns counts and ages only.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MONITOR_PRODUCTION_URL: https://bookpitch.ge
          MONITOR_SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
          MONITOR_ALERTS: ${{ inputs.alerts }}
          # Recovery may only be declared by a natural scheduled first attempt.
          # A rerun keeps its original `schedule` event, so the attempt number
          # travels with it.
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        # No `continue-on-error`, no `|| true`. A red monitor must be a red run:
        # that is the whole point of the workflow.
        run: node scripts/production-monitor.mjs
