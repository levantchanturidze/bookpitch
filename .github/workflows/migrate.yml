name: Deploy database migrations

# F-06: applies pending Prisma migrations against production on every push to
# main that touches prisma/migrations/**. Runs in parallel with Vercel's own
# git-triggered deploy — both fire from the same push. The ordering guarantee
# is that the migration is expand-only (invariant in CLAUDE.md and rbac-spec
# §9), so the deployed code may briefly run against the pre-migration schema
# without breaking. Expand-only means: new columns/tables only, existing
# shapes never removed or narrowed in the same PR that lands the code that
# needs them.
#
# The tighter guarantee ("Vercel waits for this workflow before promoting")
# requires either:
#   (a) disabling Vercel git auto-deploy and triggering a deploy hook from
#       this workflow's success step; or
#   (b) a Vercel "ignored build step" script that polls a health check
#       endpoint that exposes the applied-migration count.
# Both are follow-up work — see docs/rbac-findings.md § F-06.
#
# Uses DATABASE_URL_SUPERUSER_MIGRATE (superuser/schema-owning role) — not
# DATABASE_URL_APP_NOBYPASSRLS, which points at bookpitch_app (NOBYPASSRLS
# runtime role). Prisma migrate needs CREATE/ALTER, bookpitch_app doesn't
# have them. See F-11 for the split-URL rationale and SEC-007 for the
# env-var rename (the legacy ADMIN_MIGRATE_DATABASE_URL secret still
# works as a fallback so the migration doesn't break if only the old
# secret is set).

on:
  push:
    branches: [main]
    paths:
      - 'prisma/migrations/**'
      - 'prisma/schema.prisma'
      - '.github/workflows/migrate.yml'
  workflow_dispatch:

concurrency:
  group: migrate-prod
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # allow the failure-notify step to open an issue
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Show pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_SUPERUSER_MIGRATE || secrets.ADMIN_MIGRATE_DATABASE_URL }}
        run: npx prisma migrate status

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_SUPERUSER_MIGRATE || secrets.ADMIN_MIGRATE_DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Verify no drift after apply
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_SUPERUSER_MIGRATE || secrets.ADMIN_MIGRATE_DATABASE_URL }}
        run: npx prisma migrate status

      # SEC-007 followup: the F-06 workflow silently failed for a week
      # before it was noticed (Aug 2026 audit). Any failure here now opens
      # or updates a labeled GitHub issue that pages via GitHub's own
      # notification chain. No external Slack dependency.
      - name: Notify on failure — open or update a GitHub issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TITLE="[urgent] Migration workflow failed"
          BODY=$(cat <<EOF
          The Deploy Database Migrations workflow failed on \`main\`.

          **Commit:** \`${COMMIT_SHA}\`
          **Run:** ${RUN_URL}

          The DB schema in production is now behind the code that just deployed
          via Vercel. Expand-only migrations tolerate a brief window, but this
          state is not stable — investigate now, not on the next deploy.

          Common causes (in order of history):
          - **Stale DATABASE_URL_SUPERUSER_MIGRATE secret** (postgres password rotated after the secret was set — 28P01 in the log)
          - Migration file syntax error
          - Advisory-lock contention with a concurrent process
          - Timeouts on a slow-running migration

          Auto-created by \`.github/workflows/migrate.yml\`. Close manually
          once the underlying issue is fixed and a successful run is confirmed.
          EOF
          )
          # Find an already-open issue with the same title so repeated
          # failures don't spam. Update the body if found; create if not.
          # SEC-007 followup #2 (2026-08-04): a labeled issue alone wasn't
          # enough — issue #1 sat unnoticed for 15+ minutes before it was
          # read out of a report. GitHub only pushes @mentions and
          # assignments to a user's inbox / email / mobile app by
          # default, not new-issue creation. Assign the repo owner so
          # they actually get pinged.
          ASSIGNEE="${{ github.repository_owner }}"
          EXISTING=$(gh issue list --repo ${{ github.repository }} --state open --search "$TITLE in:title" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            # Re-assign on every comment so a snoozed notification pings again.
            gh issue comment "$EXISTING" --repo ${{ github.repository }} --body "$BODY"
            gh issue edit "$EXISTING" --repo ${{ github.repository }} --add-assignee "$ASSIGNEE" 2>/dev/null || true
          else
            # Try to ensure the label exists (cheap, idempotent). Ignore failure.
            gh label create migrate-workflow-failure --repo ${{ github.repository }} --color "d73a4a" --description "F-06 migration workflow failed" 2>/dev/null || true
            # Issue-create with assignee. If the assignee flag is rejected
            # for any reason (permissions, empty owner), fall back to
            # unassigned so we still open the ticket.
            gh issue create --repo ${{ github.repository }} --title "$TITLE" --body "$BODY" \
              --label "migrate-workflow-failure" --assignee "$ASSIGNEE" 2>/dev/null \
              || gh issue create --repo ${{ github.repository }} --title "$TITLE" --body "$BODY" --label "migrate-workflow-failure" 2>/dev/null \
              || gh issue create --repo ${{ github.repository }} --title "$TITLE" --body "$BODY"
          fi
