name: Verify Sentry delivery (and refresh the soak proof)

# §8 — old events staying readable is not proof that new ones are ingested.
#
# The soak's `observability` gate re-fetches the two events the receipt names.
# They were created before the window began, and they stay readable through
# Sentry's API no matter what happens afterwards: revoke the DSN at hour 3,
# exhaust a quota, add an inbound filter or break the transport, and that gate
# stays green while nothing new can arrive.
#
# So this runs the FULL verifier — deployed server probe, real Chromium browser
# probe, both events read back, both stacks resolved, public source maps
# affirmatively absent — every six hours while a soak is open, and hands the
# controller a fresh receipt. The soak's `observability-continuing` gate fails
# if the most recent fresh proof is older than that.
#
# Bounded on purpose: four probe pairs a day. Sentry quotas are finite, and a
# soak that exhausts one has broken the thing it was measuring.
#
# It runs whether or not a soak is open, which is the §2.6 correction. Before,
# a failed reverify exited before the controller, raised no incident, and
# outside an active soak did nothing at all — so a production where error
# delivery had silently stopped looked identical to one where it worked. The
# verifier is the only thing that can tell those apart, and it now owns the
# incident: it raises one on any non-verified outcome and is the only authority
# that closes it.
#
# The soak proof is refreshed only when a soak is open AND the run's provenance
# is naturally scheduled and first-attempt.

on:
  schedule:
    # Every four hours, offset from the soak's own :20/:50 ticks so a refresh
    # lands between them.
    #
    # The cadence and the EXPIRY are deliberately different numbers. They were
    # both six hours, which left zero margin for GitHub's scheduling delay, npm
    # install, Chromium install, Sentry indexing or queue time — so the gate
    # failed for reasons that had nothing to do with production. Measured lag on
    # this account is p95 4.13h / p99 5.03h; the expiry is 14h
    # (SOAK_DEFAULTS.maxObservabilityProofAgeHours), which survives one dropped
    # schedule at p95 lag with about 1.7h to spare.
    #
    # 6 probe pairs a day, 12 synthetic events.
    - cron: '35 */4 * * *'
  # workflow_dispatch is available for DIAGNOSIS only. The controller refuses to
  # advance the observability proof unless GitHub's own record of the run says
  # `event: schedule, run_attempt: 1` — so a dispatch runs the verifier, prints
  # what it found, and changes no soak state. Re-runs are refused for the same
  # reason: the gate exists to prove UNATTENDED ingestion, and a button press is
  # the opposite of unattended.
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  actions: read
  issues: write

concurrency:
  group: production-soak
  cancel-in-progress: false

jobs:
  reverify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Is a soak open?
        id: soak
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          open=$(gh issue list --label soak --state open --json number --jq 'length')
          echo "open=$open" >> "$GITHUB_OUTPUT"
          [ "$open" = "0" ] && echo "No soak is open; nothing to refresh." || true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for the browser probe
        run: npx playwright install --with-deps chromium

      - name: Verify Sentry against the deployed release
        # continue-on-error here does NOT swallow the failure. It exists so the
        # next step still runs and can turn the outcome into an incident; that
        # step then exits non-zero itself, which is what fails the run. Proven
        # in production by run 33925659120: verification was impossible, the
        # incident was reopened, and the run went red.
        id: verify
        continue-on-error: true
        env:
          APP_URL: https://bookpitch.ge
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_ENVIRONMENT: production
          SENTRY_RECEIPT_OUT: ${{ runner.temp }}/sentry-receipt.json
          SENTRY_OUTCOME_OUT: ${{ runner.temp }}/sentry-outcome.json
        run: node scripts/verify-sentry.mjs

      # Raise, update or resolve the observability incident from that outcome.
      # This is the ONLY authority that closes it: the production monitor can
      # see whether DSN variable names are set, which a revoked DSN satisfies.
      - name: Reconcile the observability incident
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_OUTCOME_IN: ${{ runner.temp }}/sentry-outcome.json
        run: node scripts/sentry-incident.mjs

      # Only when a soak is open, and only if verification actually passed.
      - name: Hand the fresh receipt to the soak
        if: steps.soak.outputs.open != '0' && steps.verify.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MONITOR_PRODUCTION_URL: https://bookpitch.ge
          SOAK_REVERIFY: 'true'
          SOAK_SENTRY_RECEIPT_FILE: ${{ runner.temp }}/sentry-receipt.json
          # Provenance the controller re-confirms against the GitHub API. These
          # are the workflow's claims; the API record is the authority.
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        # A dispatch or a re-run reaches this step and is refused by the
        # controller, on purpose: the run is then visibly red rather than
        # silently having done nothing.
        run: node scripts/soak-controller.mjs

      - name: Remove the receipt from the runner
        if: always()
        run: rm -f "${{ runner.temp }}/sentry-receipt.json"
