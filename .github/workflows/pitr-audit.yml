name: PITR audit

# Monthly: verifies Point-In-Time Recovery is on for the production DB.
# Layered on top of the existing daily pg_dump + monthly restore drill:
#   - Daily dumps recover a *day*.
#   - PITR recovers a *minute*.
# Neither alone is enough; both together give us a real RTO story.
#
# A failure here is a compliance incident — treat like a red backup drill.

on:
  schedule:
    - cron: '0 5 7 * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Verify PITR
        env:
          PITR_PROVIDER: ${{ secrets.PITR_PROVIDER }}
          PITR_MIN_HOURS: ${{ vars.PITR_MIN_HOURS }}
          # Neon
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          # Supabase
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PITR_HOURS: ${{ vars.SUPABASE_PITR_HOURS }}
        run: ./scripts/verify-pitr.sh
