name: EU residency audit

# Monthly compliance check: the backup bucket lives in eu-*, and no object
# is being replicated out of the EU. A failure here is treated as an
# incident — do not silence.

on:
  schedule:
    - cron: '0 3 5 * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Install awscli + jq
        run: sudo apt-get update && sudo apt-get install -y awscli jq

      - name: Verify EU residency
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-central-1
          BACKUP_S3_URI: ${{ secrets.BACKUP_S3_URI }}
        run: ./scripts/verify-eu-residency.sh
